[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-radio-automation"
version = "0.2.0"
description = "MQ Radio Automation M2 — Living Log + AI announcer / VT scripts + On-Air desk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mq-radio = "mq_radio.cli.main:main"

[tool.setuptools.packages.find]
include = ["mq_radio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
