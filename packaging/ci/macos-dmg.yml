name: macOS DMG
# Size target: 500MB–1GB+ with REAL substance (ffmpeg/Liquidsoap/demo beds).
# See packaging/SIZE_TARGET.md — never pad with junk. Music library stays external.
# Stages ffmpeg + demo beds via packaging/scripts/stage_mac_resources.sh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build MQRadioEngine with PyInstaller
        run: |
          pyinstaller packaging/mq_radio_engine.spec --noconfirm --clean
          test -x dist/MQRadioEngine/MQRadioEngine
          ls -la dist/MQRadioEngine | head -20

      - name: Stage engine into Electron resources
        run: |
          rm -rf desktop/resources/MQRadioEngine
          mkdir -p desktop/resources
          cp -R dist/MQRadioEngine desktop/resources/MQRadioEngine
          chmod +x desktop/resources/MQRadioEngine/MQRadioEngine

      - name: Stage runtime bulk (ffmpeg + demo beds + Master Control)
        env:
          MQ_RUNTIME_ARCH: arm64
          MQ_DEMO_BED_MB: "450"
        run: |
          # Host ffmpeg needed to synth beds; brew ffmpeg is fine on macos-latest
          brew install ffmpeg || true
          chmod +x packaging/scripts/stage_mac_resources.sh
          ./packaging/scripts/stage_mac_resources.sh
          test -x desktop/resources/runtime/ffmpeg/ffmpeg
          test -x desktop/resources/runtime/ffprobe/ffprobe
          test -f desktop/resources/demo_beds/MANIFEST.json
          du -sh desktop/resources/runtime desktop/resources/demo_beds desktop/resources/master_control

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install desktop packages
        working-directory: desktop
        run: npm install

      - name: Build, ad-hoc codesign, ZIP + DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dir --arm64 --publish never

          APP="dist/mac-arm64/MQ Radio.app"
          if [ ! -d "$APP" ]; then
            APP="dist/mac/MQ Radio.app"
          fi
          test -d "$APP"
          echo "Signing: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP" || true

          VERSION=$(node -p "require('./package.json').version")
          ZIP="dist/MQ-Radio-${VERSION}-arm64.zip"
          DMG="dist/MQ-Radio-${VERSION}-arm64.dmg"

          # Prefer ZIP for distribution: Finder unzip preserves signature better than some DMG paths
          ZIP_STAGE=$(mktemp -d)
          ditto "$APP" "$ZIP_STAGE/MQ Radio.app"
          # Gatekeeper helper + first-run README (packaging/macos is canonical; desktop/resources is fallback)
          for SRC in "../packaging/macos/Open MQ Radio.command" "resources/Open MQ Radio.command"; do
            if [ -f "$SRC" ]; then
              cp "$SRC" "$ZIP_STAGE/Open MQ Radio.command"
              chmod +x "$ZIP_STAGE/Open MQ Radio.command"
              break
            fi
          done
          for SRC in "../packaging/macos/README-INSTALL.txt" "resources/README-INSTALL.txt"; do
            if [ -f "$SRC" ]; then
              cp "$SRC" "$ZIP_STAGE/README-INSTALL.txt"
              break
            fi
          done
          if [ ! -f "$ZIP_STAGE/README-INSTALL.txt" ]; then
            printf '%s\n' \
              'MQ Radio - unsigned CI build' \
              '1. Unzip, drag MQ Radio.app to Applications.' \
              '2. Double-click Open MQ Radio.command (clears quarantine + ad-hoc codesign + opens).' \
              '3. Or manually: xattr -cr then codesign --force --deep --sign - then right-click Open.' \
              > "$ZIP_STAGE/README-INSTALL.txt"
          fi
          rm -f "$ZIP"
          (
            cd "$ZIP_STAGE"
            FILES=("MQ Radio.app" "README-INSTALL.txt")
            if [ -f "Open MQ Radio.command" ]; then
              FILES+=("Open MQ Radio.command")
            fi
            zip -ry "$OLDPWD/$ZIP" "${FILES[@]}"
          )
          rm -rf "$ZIP_STAGE"

          # DMG from a freshly re-signed copy (avoids stale quarantine bits in staging)
          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/MQ Radio.app"
          codesign --force --deep --sign - "$STAGE/MQ Radio.app"
          ln -sf /Applications "$STAGE/Applications"
          for SRC in "../packaging/macos/Open MQ Radio.command" "resources/Open MQ Radio.command"; do
            if [ -f "$SRC" ]; then
              cp "$SRC" "$STAGE/Open MQ Radio.command"
              chmod +x "$STAGE/Open MQ Radio.command"
              break
            fi
          done
          for SRC in "../packaging/macos/README-INSTALL.txt" "resources/README-INSTALL.txt"; do
            if [ -f "$SRC" ]; then
              cp "$SRC" "$STAGE/README-INSTALL.txt"
              break
            fi
          done
          if [ ! -f "$STAGE/README-INSTALL.txt" ]; then
            printf '%s\n' \
              'MQ Radio - unsigned CI build' \
              '1. Prefer the .zip: unzip, drag MQ Radio.app to Applications.' \
              '2. Double-click Open MQ Radio.command (xattr + ad-hoc codesign + open).' \
              '3. Or manually:' \
              '   xattr -cr "/Applications/MQ Radio.app"' \
              '   codesign --force --deep --sign - "/Applications/MQ Radio.app"' \
              '4. Right-click -> Open the first time (Gatekeeper).' \
              > "$STAGE/README-INSTALL.txt"
          fi
          hdiutil create -volname "MQ Radio" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"

          ls -la dist
          ls -la "$APP"
          # Prove Gatekeeper helper + README are inside the ZIP
          unzip -l "$ZIP" | head -40
          file "$ZIP" "$DMG"


      - name: Assert package substance (soft size + listing)
        working-directory: desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="dist/MQ-Radio-${VERSION}-arm64.zip"
          test -f "$ZIP"
          # Prove bundled runtime + beds are inside the app Resources
          unzip -l "$ZIP" | tee /tmp/mq-zip-list.txt | head -60
          grep -E 'runtime/.*/ffmpeg|runtime/ffmpeg' /tmp/mq-zip-list.txt || grep -E 'ffmpeg' /tmp/mq-zip-list.txt
          grep -E 'demo_beds/.*\.wav|demo_beds/MANIFEST' /tmp/mq-zip-list.txt
          BYTES=$(wc -c < "$ZIP" | tr -d ' ')
          MB=$((BYTES / 1024 / 1024))
          echo "ZIP size: ${MB} MB (${BYTES} bytes)"
          if [ "$MB" -lt 400 ]; then
            echo "::warning::Mac ZIP is ${MB}MB (<400MB soft target). See packaging/SIZE_TARGET.md — grow beds/runtime, never pad junk."
          else
            echo "OK soft size bar met (≥400MB)"
          fi

      - name: Upload DMG + ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MQ-Radio-macOS-DMG
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30
