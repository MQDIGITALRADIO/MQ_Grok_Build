name: macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build MQRadioEngine with PyInstaller
        run: |
          pyinstaller packaging/mq_radio_engine.spec --noconfirm --clean
          test -x dist/MQRadioEngine/MQRadioEngine
          ls -la dist/MQRadioEngine | head -20

      - name: Stage engine into Electron resources
        run: |
          rm -rf desktop/resources/MQRadioEngine
          mkdir -p desktop/resources
          cp -R dist/MQRadioEngine desktop/resources/MQRadioEngine
          chmod +x desktop/resources/MQRadioEngine/MQRadioEngine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install desktop packages
        working-directory: desktop
        run: npm install

      - name: Build, ad-hoc codesign, ZIP + DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dir --arm64 --publish never

          APP="dist/mac-arm64/MQ Radio.app"
          if [ ! -d "$APP" ]; then
            APP="dist/mac/MQ Radio.app"
          fi
          test -d "$APP"
          echo "Signing: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP" || true

          VERSION=$(node -p "require('./package.json').version")
          ZIP="dist/MQ-Radio-${VERSION}-arm64.zip"
          DMG="dist/MQ-Radio-${VERSION}-arm64.dmg"

          # Prefer ZIP for distribution: Finder unzip preserves signature better than some DMG paths
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          # DMG from a freshly re-signed copy (avoids stale quarantine bits in staging)
          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/MQ Radio.app"
          codesign --force --deep --sign - "$STAGE/MQ Radio.app"
          ln -sf /Applications "$STAGE/Applications"
          printf '%s\n' \
            'MQ Radio - unsigned CI build' \
            '1. Prefer the .zip: double-click to unzip, then drag MQ Radio.app to Applications.' \
            '2. If macOS says damaged:' \
            '   xattr -cr "/Applications/MQ Radio.app"' \
            '   codesign --force --deep --sign - "/Applications/MQ Radio.app"' \
            '3. Right-click -> Open the first time (Gatekeeper).' \
            > "$STAGE/README-INSTALL.txt"
          hdiutil create -volname "MQ Radio" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"

          ls -la dist
          ls -la "$APP"
          file "$ZIP" "$DMG"

      - name: Upload DMG + ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MQ-Radio-macOS-DMG
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30
